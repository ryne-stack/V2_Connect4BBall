<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connect Four Basketball</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #111827;
      --panel-2: #1f2937;
      --line: #334155;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --orange: #f97316;
      --blue: #2563eb;
      --empty: #0b1220;
      --win: #facc15;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #1e293b, var(--bg) 50%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .scoreboard {
      width: min(1200px, 100%);
      background: linear-gradient(180deg, #0b1220, #0f172a);
      border: 2px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      padding: 1rem;
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 1rem;
    }

    .side-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .status-box {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: .75rem;
    }

    .label { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
    .value { font-size: 1rem; margin-top: .3rem; }

    .controls {
      display: grid;
      gap: .5rem;
    }

    button {
      width: 100%;
      border: 1px solid #4b5563;
      background: #111827;
      color: var(--text);
      border-radius: 10px;
      padding: .7rem .8rem;
      font-size: .95rem;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease;
    }

    button:hover { background: #1f2937; }
    button:active { transform: translateY(1px); }

    .miss-btn { border-color: #be123c; background: #500724; }
    .miss-btn:hover { background: #6d0b31; }
    .reset-btn { border-color: #b45309; background: #78350f; }

    .board-section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: .8rem;
    }

    .teams {
      display: flex;
      gap: .75rem;
    }

    .team-chip {
      flex: 1;
      border-radius: 999px;
      padding: .45rem .9rem;
      border: 2px solid transparent;
      font-weight: 600;
      text-align: center;
      background: #0b1220;
      color: white;
      opacity: .5;
    }

    .team-chip.active { opacity: 1; }
    .team-chip.orange.active { border-color: var(--orange); box-shadow: 0 0 0 2px rgba(249,115,22,.2); }
    .team-chip.blue.active { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(37,99,235,.2); }

    .hoops,
    .grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(64px, 1fr));
      gap: .65rem;
    }

    .hoop-btn {
      border: 2px solid #64748b;
      background: #1e293b;
      border-radius: 12px;
      height: 62px;
      font-size: 1.8rem;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hoop-btn:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .cell {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 16px;
      border: 1px solid #334155;
      background: var(--empty);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      position: relative;
      cursor: pointer;
      user-select: none;
    }

    .cell.empty { cursor: default; }

    .cell.orange { background: radial-gradient(circle at 35% 30%, #fdba74, var(--orange)); }
    .cell.blue { background: radial-gradient(circle at 35% 30%, #93c5fd, var(--blue)); }

    .cell.orange::before,
    .cell.blue::before {
      content: "🏀";
      position: absolute;
      font-size: 1.9rem;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,.4));
    }

    .cell.win {
      outline: 4px solid var(--win);
      box-shadow: 0 0 18px rgba(250, 204, 21, .65);
    }

    .small { font-size: .83rem; color: var(--muted); }

    @media (max-width: 940px) {
      .scoreboard { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="scoreboard">
    <aside class="side-panel">
      <h1>Connect Four Basketball</h1>
      <div class="status-box">
        <div class="label">Current Turn</div>
        <div class="value" id="turnText">Orange Team</div>
      </div>
      <div class="status-box">
        <div class="label">Game Status</div>
        <div class="value" id="statusText">In Progress</div>
      </div>
      <div class="status-box">
        <div class="label">Last Action</div>
        <div class="value" id="lastActionText">Game started.</div>
      </div>

      <section class="controls" aria-label="controls">
        <button class="miss-btn" id="missBtn">Miss Shot / Pass Turn</button>
        <button id="undoBtn">Undo Last Action</button>
        <button class="reset-btn" id="resetBtn">Reset Game</button>
        <button id="renameBtn">Edit Team Names</button>
      </section>
      <div class="small">Tip: Click a hoop to add a made basket. Click any placed basketball to remove it quickly.</div>
    </aside>

    <section class="board-section">
      <div class="teams">
        <div class="team-chip orange" id="orangeChip">Orange Team</div>
        <div class="team-chip blue" id="blueChip">Blue Team</div>
      </div>

      <div class="hoops" id="hoops"></div>
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <script>
    const ROWS = 5;
    const COLS = 5;

    const state = {
      board: Array.from({ length: ROWS }, () => Array(COLS).fill(null)),
      currentTeam: 'orange',
      gameOver: false,
      winner: null,
      winningCells: [],
      history: [],
      teamNames: {
        orange: 'Orange Team',
        blue: 'Blue Team'
      },
      lastAction: 'Game started.'
    };

    const els = {
      hoops: document.getElementById('hoops'),
      grid: document.getElementById('grid'),
      turnText: document.getElementById('turnText'),
      statusText: document.getElementById('statusText'),
      lastActionText: document.getElementById('lastActionText'),
      orangeChip: document.getElementById('orangeChip'),
      blueChip: document.getElementById('blueChip'),
      missBtn: document.getElementById('missBtn'),
      undoBtn: document.getElementById('undoBtn'),
      resetBtn: document.getElementById('resetBtn'),
      renameBtn: document.getElementById('renameBtn')
    };

    function cloneState() {
      return {
        board: state.board.map(row => [...row]),
        currentTeam: state.currentTeam,
        gameOver: state.gameOver,
        winner: state.winner,
        winningCells: state.winningCells.map(c => ({...c})),
        teamNames: { ...state.teamNames },
        lastAction: state.lastAction
      };
    }

    function pushHistory(type) {
      state.history.push({ snapshot: cloneState(), type });
      if (state.history.length > 200) state.history.shift();
    }

    function renderHoops() {
      els.hoops.innerHTML = '';
      for (let c = 0; c < COLS; c++) {
        const btn = document.createElement('button');
        btn.className = 'hoop-btn';
        btn.type = 'button';
        btn.textContent = '⛹️‍♂️🧺';
        btn.title = `Drop in column ${c + 1}`;
        btn.disabled = state.gameOver || state.board[0][c] !== null;
        btn.addEventListener('click', () => dropInColumn(c));
        els.hoops.appendChild(btn);
      }
    }

    function renderGrid() {
      els.grid.innerHTML = '';
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('button');
          cell.className = 'cell';
          cell.type = 'button';
          const value = state.board[r][c];
          if (value) {
            cell.classList.add(value);
            if (state.winningCells.some(p => p.r === r && p.c === c)) {
              cell.classList.add('win');
            }
            cell.title = `Remove ${teamLabel(value)} token`;
            cell.addEventListener('click', () => removeToken(r, c));
          } else {
            cell.classList.add('empty');
            cell.setAttribute('aria-disabled', 'true');
          }
          els.grid.appendChild(cell);
        }
      }
    }

    function teamLabel(team) {
      return state.teamNames[team];
    }

    function switchTurn() {
      state.currentTeam = state.currentTeam === 'orange' ? 'blue' : 'orange';
    }

    function dropInColumn(col) {
      if (state.gameOver) return;
      let targetRow = -1;
      for (let r = ROWS - 1; r >= 0; r--) {
        if (!state.board[r][col]) {
          targetRow = r;
          break;
        }
      }
      if (targetRow === -1) return;

      pushHistory('drop');
      const team = state.currentTeam;
      state.board[targetRow][col] = team;
      state.lastAction = `${teamLabel(team)} made a shot in column ${col + 1}.`;

      const winData = findWinner();
      if (winData) {
        state.gameOver = true;
        state.winner = winData.winner;
        state.winningCells = winData.cells;
      } else {
        switchTurn();
      }

      render();
    }

    function missShot() {
      if (state.gameOver) return;
      pushHistory('miss');
      const team = state.currentTeam;
      state.lastAction = `${teamLabel(team)} missed their shot. Turn passed.`;
      switchTurn();
      render();
    }

    function removeToken(r, c) {
      if (!state.board[r][c]) return;
      pushHistory('remove');
      const removedTeam = state.board[r][c];
      state.board[r][c] = null;
      state.gameOver = false;
      state.winner = null;
      state.winningCells = [];
      state.lastAction = `${teamLabel(removedTeam)} token removed from row ${r + 1}, column ${c + 1}.`;
      render();
    }

    function undo() {
      const previous = state.history.pop();
      if (!previous) {
        state.lastAction = 'No action to undo.';
        render();
        return;
      }
      Object.assign(state, {
        board: previous.snapshot.board,
        currentTeam: previous.snapshot.currentTeam,
        gameOver: previous.snapshot.gameOver,
        winner: previous.snapshot.winner,
        winningCells: previous.snapshot.winningCells,
        teamNames: previous.snapshot.teamNames,
        lastAction: `Undid previous ${previous.type} action.`
      });
      render();
    }

    function resetGame() {
      state.board = Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      state.currentTeam = 'orange';
      state.gameOver = false;
      state.winner = null;
      state.winningCells = [];
      state.history = [];
      state.lastAction = 'Board reset. New game started.';
      render();
    }

    function editTeamNames() {
      pushHistory('rename');
      const orange = prompt('Enter name for Orange Team:', state.teamNames.orange);
      if (orange === null) return;
      const blue = prompt('Enter name for Blue Team:', state.teamNames.blue);
      if (blue === null) return;
      state.teamNames.orange = orange.trim() || 'Orange Team';
      state.teamNames.blue = blue.trim() || 'Blue Team';
      state.lastAction = 'Team names updated.';
      render();
    }

    function findWinner() {
      const dirs = [
        [0, 1],
        [1, 0],
        [1, 1],
        [1, -1]
      ];

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const team = state.board[r][c];
          if (!team) continue;

          for (const [dr, dc] of dirs) {
            const cells = [{ r, c }];
            let rr = r;
            let cc = c;
            let ok = true;
            for (let i = 1; i < 4; i++) {
              rr += dr;
              cc += dc;
              if (rr < 0 || rr >= ROWS || cc < 0 || cc >= COLS || state.board[rr][cc] !== team) {
                ok = false;
                break;
              }
              cells.push({ r: rr, c: cc });
            }
            if (ok) return { winner: team, cells };
          }
        }
      }
      return null;
    }

    function renderStatus() {
      els.turnText.textContent = state.gameOver
        ? `${teamLabel(state.winner)} won`
        : teamLabel(state.currentTeam);
      els.statusText.textContent = state.gameOver
        ? `🏆 ${teamLabel(state.winner)} connected four!`
        : 'In Progress';
      els.lastActionText.textContent = state.lastAction;

      els.orangeChip.textContent = state.teamNames.orange;
      els.blueChip.textContent = state.teamNames.blue;
      els.orangeChip.classList.toggle('active', state.currentTeam === 'orange' && !state.gameOver);
      els.blueChip.classList.toggle('active', state.currentTeam === 'blue' && !state.gameOver);

      els.missBtn.disabled = state.gameOver;
    }

    function render() {
      renderStatus();
      renderHoops();
      renderGrid();
    }

    els.missBtn.addEventListener('click', missShot);
    els.undoBtn.addEventListener('click', undo);
    els.resetBtn.addEventListener('click', resetGame);
    els.renameBtn.addEventListener('click', editTeamNames);

    render();
  </script>
</body>
</html>
